name: Release

# Push a tag that matches package.json's version (for example v0.2.0) to build both installers and publish them.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # Keep new releases in draft until both platform artifacts are uploaded.
      # A draft is not found by `gh release view`, so look for the tag in the list. A re-run keeps the release it already has.
      - name: Create the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -Fx "$GITHUB_REF_NAME" > /dev/null \
            || gh release create "$GITHUB_REF_NAME" --title "ApexPing $GITHUB_REF_NAME" --generate-notes --draft

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # gh uses GH_TOKEN; nothing here pushes
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:helper
      - run: npm test
      - run: npm run dist
      - run: npm run package:editions
      - name: Check Windows artifacts
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test -s "release/ApexPing-Setup-${version}.exe"
          test -s "release/ApexPing-Setup-${version}.exe.blockmap"
          test -s "release/ApexPing-${version}-Windows-x64.zip"
          test -s "release/ApexPing-${version}-Windows-x64-base.zip"
          test -s "release/ApexPing-${version}-voices-zh-CN.zip"
          test -s "release/ApexPing-${version}-voices-en.zip"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ApexPing-windows-validation
          path: |
            release/ApexPing-Setup-*.exe
            release/ApexPing-Setup-*.exe.blockmap
            release/ApexPing-*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload the installer and blockmap
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # publish:null disables update metadata generation; do not require latest.yml.
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "release/ApexPing-Setup-${GITHUB_REF_NAME#v}.exe" \
            "release/ApexPing-Setup-${GITHUB_REF_NAME#v}.exe.blockmap" \
            "release/ApexPing-${GITHUB_REF_NAME#v}-Windows-x64.zip" \
            "release/ApexPing-${GITHUB_REF_NAME#v}-Windows-x64-base.zip" \
            "release/ApexPing-${GITHUB_REF_NAME#v}-voices-zh-CN.zip" \
            "release/ApexPing-${GITHUB_REF_NAME#v}-voices-en.zip" \
            --clobber

  mac:
    needs: release
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # gh uses GH_TOKEN; nothing here pushes
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:helper
      - run: npm test
      - run: npm run dist:mac
      - run: codesign --verify --deep --strict "release/mac-arm64/ApexPing.app"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ApexPing-mac-validation
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Upload the disk image
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "release/ApexPing-${GITHUB_REF_NAME#v}-arm64.dmg" --clobber

  # Manual runs validate builds without changing existing releases.
  publish:
    if: github.event_name == 'push'
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
